openapi: 3.1.0
info:
  title: Sentrix Home API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/media/import:
    post:
      tags:
      - media
      summary: Import Media
      operationId: import_media_api_v1_media_import_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_media_api_v1_media_import_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets:
    get:
      tags:
      - media
      summary: List Assets
      operationId: list_assets_api_v1_assets_get
      parameters:
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          default: home-default
          title: Scope Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{asset_id}:
    get:
      tags:
      - media
      summary: Get Asset
      operationId: get_asset_api_v1_assets__asset_id__get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{asset_id}/file:
    get:
      tags:
      - media
      summary: Get Asset File
      operationId: get_asset_file_api_v1_assets__asset_id__file_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{asset_id}/preview:
    get:
      tags:
      - media
      summary: Get Asset Preview
      operationId: get_asset_preview_api_v1_assets__asset_id__preview_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/search:
    get:
      tags:
      - search
      summary: Search Assets
      operationId: search_assets_api_v1_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: 内容词，例如 桥 / 海边 / 红色
          title: Q
        description: 内容词，例如 桥 / 海边 / 红色
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          default: home-default
          title: Scope Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assistant/conversations:
    post:
      tags:
      - assistant
      summary: Create Conversation
      operationId: create_conversation_api_v1_assistant_conversations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - assistant
      summary: List Conversations
      operationId: list_conversations_api_v1_assistant_conversations_get
      parameters:
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          default: home-default
          title: Scope Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assistant/conversations/{conversation_id}:
    get:
      tags:
      - assistant
      summary: Get Conversation
      operationId: get_conversation_api_v1_assistant_conversations__conversation_id__get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - assistant
      summary: Rename Conversation
      operationId: rename_conversation_api_v1_assistant_conversations__conversation_id__patch
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConversationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - assistant
      summary: Delete Conversation
      operationId: delete_conversation_api_v1_assistant_conversations__conversation_id__delete
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assistant/conversations/{conversation_id}/turns:
    post:
      tags:
      - assistant
      summary: Start Turn
      description: '建一个回合并立刻返回 ``turn_id``，执行放在工作线程里。


        回合先落库（``pending``）、再由 SSE 订阅，是「前端不轮询」能成立的前提：SSE 端点

        永远有东西可订阅，哪怕连接晚到几百毫秒。


        scope 不在请求里：回合继承会话的 scope。调用方多传的 ``scope_id`` 从 S3 交付起

        就被忽略，现在连字段都不存在了。'
      operationId: start_turn_api_v1_assistant_conversations__conversation_id__turns_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTurnRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartTurnResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assistant/turns/{turn_id}/events:
    get:
      tags:
      - assistant
      summary: Turn Events
      description: '回合事件的 SSE 流。跑完即关，不需要前端再问一次状态。


        订阅顺序是**先读库、再订阅内存流**：库里是所有已经落盘的事件（断线重连与迟到加入

        都能补），内存流是此刻还没落盘的增量。两边按 ``step_index`` 去重。'
      operationId: turn_events_api_v1_assistant_turns__turn_id__events_get
      parameters:
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
          title: Turn Id
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assistant/turns/{turn_id}:
    get:
      tags:
      - assistant
      summary: Get Turn
      description: 'B3.4：轮询异步回合的实时进度与最终结果（1.0 ``app.py:2938`` 的契约）。


        这条端点给的是**与 SSE 完全等价**的信息：同样的进度事件、同样的终态载荷。浏览器的

        主路径仍然是那条 SSE（``useTurnStream`` 先开 ``EventSource``，断了才回退到这里，

        与 1.0 ``src/app.js:1482`` 的顺序一致）；``EventSource`` 用不了的调用方——评测机、

        脚本、CI——只有这一条路。'
      operationId: get_turn_api_v1_assistant_turns__turn_id__get
      parameters:
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
          title: Turn Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assistant/result-sets/{result_set_id}/photo:
    get:
      tags:
      - assistant
      summary: Result Set Photo
      description: "B3.2：结果集授权原图交付。``handle`` 必须属于该结果集，且 scope 必须匹配。\n\n1.0 ``app.py:2484``\
        \ 的忠实移植，四条判断逐条对齐（顺序也一样）：\n\n- 结果集不存在 → 404 ``result set not found``（1.0 还带「或已过期」；2.0\
        \ 的\n  ``ResultSet`` 没有 expires_at 这一格，见下述）；\n- ``rs.scope_id != scope_id``\
        \ → 403 ``scope mismatch``；\n- 给了 ``handle`` 但它不在该结果集里 → 404 ``handle not\
        \ in result set``；\n- 没给 ``handle`` → 取结果集第一张；结果集为空 → 404 ``empty result set``。\n\
        \n为什么值得搬：它是**唯一**一条把「模型给的 ``photo_N``」和「真实 ``asset_id``」隔开的\n交付路径——``resolve``\
        \ 只在结果集自己那一串 asset_id 上做下标映射，越界返回 ``None``。\n前端拿到的 URL 里从头到尾没有 asset_id（1.0\
        \ ``src/api.js:67``），于是「只交付它真的\n看过的图」是个结构性事实，而不是提示词里的一句请求。\n\n与 1.0 的两处差异，都是\
        \ 2.0 这边缺的那一格数据：\n\n1. **没有 ``expires_at``。** 1.0 的 ``ResultSet`` 有这一列，2.0\
        \ 的没有，于是「过期」\n   在 2.0 表现为「查不到」，同样是 404。过期本身属于 S4 的维护面。\n2. **``original``\
        \ 的语义沿用 2.0 媒体端点的既有映射**：``original=1`` 给原文件，\n   默认给服务端转码的 JPEG 预览（1.0 默认也走归一化转码，只有\
        \ ``original=1``\n   才给原图）。"
      operationId: result_set_photo_api_v1_assistant_result_sets__result_set_id__photo_get
      parameters:
      - name: result_set_id
        in: path
        required: true
        schema:
          type: string
          title: Result Set Id
      - name: handle
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Handle
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          default: home-default
          title: Scope Id
      - name: original
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Original
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssetListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssetSummary'
          type: array
          title: Items
      type: object
      required:
      - items
      title: AssetListResponse
    AssetSummary:
      properties:
        id:
          type: string
          title: Id
        file_name:
          type: string
          title: File Name
        media_type:
          type: string
          title: Media Type
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
        size_bytes:
          type: integer
          title: Size Bytes
        status:
          type: string
          title: Status
        captured_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Captured At
        gps:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Gps
      type: object
      required:
      - id
      - file_name
      - media_type
      - mime_type
      - size_bytes
      - status
      - captured_at
      - gps
      title: AssetSummary
    AttachmentSummary:
      properties:
        handle:
          type: string
          title: Handle
        asset_id:
          type: string
          title: Asset Id
        file_name:
          type: string
          title: File Name
      type: object
      required:
      - handle
      - asset_id
      - file_name
      title: AttachmentSummary
    Body_import_media_api_v1_media_import_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        scope_id:
          type: string
          title: Scope Id
          default: home-default
      type: object
      required:
      - file
      title: Body_import_media_api_v1_media_import_post
    CompleteEventPayload:
      properties:
        type:
          type: string
          title: Type
          default: complete
        turn_id:
          type: string
          title: Turn Id
        status:
          type: string
          title: Status
        termination_reason:
          type: string
          title: Termination Reason
        answer:
          type: string
          title: Answer
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentSummary'
          type: array
          title: Attachments
        requirements:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Requirements
        error:
          type: string
          title: Error
          default: ''
      type: object
      required:
      - turn_id
      - status
      - termination_reason
      - answer
      - attachments
      - requirements
      title: CompleteEventPayload
      description: '``complete`` 事件的 ``data``。


        与 1.0 的一处刻意差异：**不再把整条 ``public_progress`` 又塞一遍**。1.0 的 ``complete``

        帧把已经逐条发过的进度事件完整重发（``app.py:2989``），是纯粹的带宽浪费。'
    ConversationDetailResponse:
      properties:
        conversation:
          $ref: '#/components/schemas/ConversationSummary'
        messages:
          items:
            $ref: '#/components/schemas/MessageSummary'
          type: array
          title: Messages
        turns:
          items:
            $ref: '#/components/schemas/TurnSummary'
          type: array
          title: Turns
      type: object
      required:
      - conversation
      - messages
      - turns
      title: ConversationDetailResponse
    ConversationListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConversationSummary'
          type: array
          title: Items
      type: object
      required:
      - items
      title: ConversationListResponse
    ConversationSummary:
      properties:
        id:
          type: string
          title: Id
        scope_id:
          type: string
          title: Scope Id
        title:
          type: string
          title: Title
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        last_message_at:
          type: string
          title: Last Message At
      type: object
      required:
      - id
      - scope_id
      - title
      - created_at
      - updated_at
      - last_message_at
      title: ConversationSummary
    CreateConversationRequest:
      properties:
        scope_id:
          type: string
          title: Scope Id
          default: home-default
        title:
          type: string
          title: Title
          default: ''
      type: object
      title: CreateConversationRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportResponse:
      properties:
        asset_id:
          type: string
          title: Asset Id
        observation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Observation Id
        media_type:
          type: string
          title: Media Type
        status:
          type: string
          title: Status
        deduplicated:
          type: boolean
          title: Deduplicated
        indexed:
          type: boolean
          title: Indexed
      type: object
      required:
      - asset_id
      - observation_id
      - media_type
      - status
      - deduplicated
      - indexed
      title: ImportResponse
    MessageSummary:
      properties:
        id:
          type: string
          title: Id
        role:
          type: string
          title: Role
        content:
          type: string
          title: Content
        turn_id:
          type: string
          title: Turn Id
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - id
      - role
      - content
      - turn_id
      - created_at
      title: MessageSummary
    ProgressEventPayload:
      properties:
        text:
          type: string
          title: Text
        status:
          type: string
          title: Status
        stage:
          type: string
          title: Stage
        step_index:
          type: integer
          title: Step Index
        timestamp:
          type: string
          title: Timestamp
        kind:
          type: string
          title: Kind
          default: status
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - text
      - status
      - stage
      - step_index
      - timestamp
      title: ProgressEventPayload
      description: '``progress`` 事件的 ``data``。


        字段集沿用 1.0（``runtime.py:1664-1687``），并补上 ``kind`` 与 ``payload``。

        ``step_index`` 同时是 SSE 的 ``id:`` 值，于是 ``Last-Event-ID`` 断线续传天然可用。'
    RenameConversationRequest:
      properties:
        title:
          type: string
          maxLength: 80
          minLength: 1
          title: Title
      type: object
      required:
      - title
      title: RenameConversationRequest
    SearchHit:
      properties:
        asset:
          $ref: '#/components/schemas/AssetSummary'
        score:
          type: number
          title: Score
        channels:
          additionalProperties:
            type: integer
          type: object
          title: Channels
        raw_scores:
          additionalProperties:
            type: number
          type: object
          title: Raw Scores
      type: object
      required:
      - asset
      - score
      - channels
      - raw_scores
      title: SearchHit
      description: 一条命中。``asset`` 是可打开的原图本身——产品硬约束：查询必须返回原图。
    SearchResponse:
      properties:
        query:
          type: string
          title: Query
        backend:
          type: string
          title: Backend
        degraded:
          type: boolean
          title: Degraded
        degraded_reason:
          type: string
          title: Degraded Reason
        authoritative_vectors:
          type: integer
          title: Authoritative Vectors
        items:
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
          title: Items
      type: object
      required:
      - query
      - backend
      - degraded
      - degraded_reason
      - authoritative_vectors
      - items
      title: SearchResponse
    StartTurnRequest:
      properties:
        message:
          type: string
          maxLength: 2000
          minLength: 1
          title: Message
        conversation_id:
          type: string
          title: Conversation Id
          default: ''
      type: object
      required:
      - message
      title: StartTurnRequest
      description: '建回合的请求。**没有 scope**：回合的 scope 由它所属的会话决定。


        这里曾经有一个 ``scope_id: str = "home-default"``。它让调用方在不传 scope 时

        把回合落到默认值上，而会话自己的 scope 被完全忽略——检索于是在空库里跑，

        失败还是静默的（表现成「搜索质量差」而不是「配置错了」）。'
    StartTurnResponse:
      properties:
        turn_id:
          type: string
          title: Turn Id
        conversation_id:
          type: string
          title: Conversation Id
        status:
          type: string
          title: Status
      type: object
      required:
      - turn_id
      - conversation_id
      - status
      title: StartTurnResponse
    TurnPollResponse:
      properties:
        turn_id:
          type: string
          title: Turn Id
        status:
          type: string
          title: Status
        public_progress:
          items:
            $ref: '#/components/schemas/ProgressEventPayload'
          type: array
          title: Public Progress
        result:
          anyOf:
          - $ref: '#/components/schemas/CompleteEventPayload'
          - type: 'null'
        error:
          type: string
          title: Error
          default: ''
      type: object
      required:
      - turn_id
      - status
      - public_progress
      title: TurnPollResponse
