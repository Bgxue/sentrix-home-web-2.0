      description: '批量确认**不做全或无**：一件失败不影响其余，逐件回执。


        1.0 就是这个形状（``app.py:2226`` 的 ``confirmed`` / ``failed`` / ``count``），

        理由是批量确认的输入来自用户逐个点选，一件失败就把整批回滚会丢掉其余选择。'
