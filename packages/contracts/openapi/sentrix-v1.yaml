      summary: Import Album
      description: '整册导入。**同步执行**：2.0 没有任务队列，装作异步只会把「跑到哪了」藏起来。


        整册导入要串行走模型调用，所以这个请求会跑很久——客户端的超时必须自己调大，

        这一点写在 ``docs/runbooks/geonames-data.md`` 的相邻章节（导入一节）。'
