      description: '实体详情。1.0 ``app.py:1948-1956`` 加 ``db.py:4570-4627``。


        两条边界：用例对不存在的实体返回 ``None`` → 404 ``entity not found``

        （1.0 是 ``if not value:`` 判的，同一个条件）；pending 的人物**只换名字**，

        理由写在 ``_entity_detail_payload`` 里。'
