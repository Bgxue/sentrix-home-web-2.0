      summary: Search Assets
      operationId: search_assets_api_v1_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: 内容词，例如 桥 / 海边 / 红色
          title: Q
        description: 内容词，例如 桥 / 海边 / 红色
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Scope Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: time_range
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
          description: 时间条件，例如 2023年10月 / 2025年-2026年
          default: ''
          title: Time Range
        description: 时间条件，例如 2023年10月 / 2025年-2026年
      - name: person
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 人物条件，可重复：scope 内已确认人物的本名
          default: []
          title: Person
        description: 人物条件，可重复：scope 内已确认人物的本名
      - name: place
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
          description: 地点条件，服务端按解析出的行政区/地名匹配
          default: ''
          title: Place
        description: 地点条件，服务端按解析出的行政区/地名匹配
      - name: media_type
        in: query
        required: false
        schema:
          type: string
          maxLength: 20
          description: 媒体类型：image / video / audio / text
          default: ''
          title: Media Type
        description: 媒体类型：image / video / audio / text
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
