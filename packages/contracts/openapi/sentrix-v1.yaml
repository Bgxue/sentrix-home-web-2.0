          $ref: '#/components/schemas/PersonPayload'
        merged_into:
          anyOf:
          - type: string
          - type: 'null'
          title: Merged Into
      type: object
      required:
      - entity
      - merged_into
      title: ConfirmClusterResponse
      description: '``merged_into`` 非空表示这次确认并进了另一个已存在的人（同名合并）。'
