[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sentrix"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps/api/src/sentrix/domain", "apps/api/src/sentrix/application"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sentrix.domain", "sentrix.application"]

[tool.coverage.report]
fail_under = 85
show_missing = true
