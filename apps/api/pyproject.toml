[project]
name = "sentrix"
version = "0.1.0"
description = "Sentrix Home 2.0 product API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "pillow>=11,<12",
    "pillow-heif>=0.18,<1",
    # 视觉记忆是**进程内**推理（设计 §2.2：模型适配属于 apps/api，进程生命周期
    # 不归 2.0 管的是 8100/8101 那些服务）。chinese-clip 的权重是
    # ~/.cache/clip/clip_cn_vit-l-14.pt，约 1.6GB，随 cn-clip 之外单独下载。
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "cn-clip>=1.6,<2",
    # 嵌入式 Qdrant 做派生索引；权威始终是 SQLite 的 memory_vectors。
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "pre-commit>=4,<5",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 迁移脚本不是 .py，不加这条不会进 wheel。editable 安装读源码树看不出来，
# 部署装 wheel 时 MIGRATIONS_DIR 会变成空目录——那正是 migrate() 过去静默 no-op 的分支。
[tool.setuptools.package-data]
sentrix = ["infrastructure/persistence/migrations/*.sql"]
